/urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    calibrate_time: false
    cluster: 1
    default_user_latency: 0.0
    diagnostic_updater:
      period: 1.0
      use_fqn: false
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    ip_address: 192.168.0.10
    ip_port: 10940
    laser_frame_id: laser
    publish_intensity: false
    publish_multiecho: false
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    serial_baud: 115200
    serial_port: /dev/cu.usbmodem141101
    skip: 0
    start_type_description_service: true
    use_sim_time: false
