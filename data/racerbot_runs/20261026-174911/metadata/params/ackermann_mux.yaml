/ackermann_mux:
  ros__parameters:
    diagnostic_updater:
      period: 1.0
      use_fqn: false
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    start_type_description_service: true
    topics:
      joystick:
        priority: 100
        timeout: 0.2
        topic: teleop
      navigation:
        priority: 10
        timeout: 0.2
        topic: drive
    use_sim_time: false
