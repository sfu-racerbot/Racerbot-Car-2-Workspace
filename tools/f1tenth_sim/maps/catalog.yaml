room_2026_07_27:
  import_command: python3 tools/f1tenth_sim/track_import.py tools/f1tenth_sim/maps/sources/room_2026_07_27.yaml
    --name room_2026_07_27 --source "this car's slam_toolbox map, ~/.ros/racerbot_auto/20260727-200103"
  lap_length_m: 14.64
  source: this car's slam_toolbox map, ~/.ros/racerbot_auto/20260727-200103
  width_median_m: 1.42
