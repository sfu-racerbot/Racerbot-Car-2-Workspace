    --name levine_blocked --source 'sfu-racerbot/racerbot_a src/maps/levine_blocked.yaml
    (levine, side corridors closed)'
  lap_length_m: 63.29
  source: sfu-racerbot/racerbot_a src/maps/levine_blocked.yaml (levine, side corridors
    closed)
  width_median_m: 1.6
  width_min_m: 1.5
  width_p10_m: 1.6
levine_obs:
