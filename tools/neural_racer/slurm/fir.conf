# The one file to edit before running anything on FIR. fir_run.sh reads it.

# Your allocation: the "def-..." name in CCDB (ccdb.alliancecan.ca -> My Account).
NR_ACCOUNT=def-CHANGEME

# Must be the module tools/f1tenth_sim/setup.sh was run under (fir_setup.sh does both).
NR_PYTHON_MODULE=python/3.11

# Environments per GPU. Replace with "chosen" -> "num_envs" from the benchmark's
# benchmark.json once it has run (fir_run.sh status prints it).
NR_NUM_ENVS=16384

# Run names: folders under $SCRATCH/neural_racer/runs/. Reuse a name to resume it;
# change it to start fresh.
NR_TEACHER_RUN=teacher-v1
NR_DISTILL_RUN=distill-v1
NR_LEAGUE_RUN=league-v1

# Each submission is a chain of this many resumable segments of NR_TIME each.
# On a default allocation, shorter segments (3:00:00) often start sooner.
NR_SEGMENTS=4
NR_TIME=12:00:00
