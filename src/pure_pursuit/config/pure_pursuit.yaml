pure_pursuit_node:
  ros__parameters:
    # --- Required: set this before racing. No "real" default is provided
    # on purpose -- an empty/missing waypoints file makes the node refuse
    # to start rather than silently drive nothing, or an old/wrong track.
    waypoints_file: ''
    # Only auto_map_race_launch.py overrides this to true. In normal modes,
    # retaining false preserves fail-fast behavior for a missing raceline.
    wait_for_waypoints: false
    closed_loop: true

    # --- Topics ---
    pose_topic: /pf/viz/inferred_pose   # geometry_msgs/PoseStamped, published by particle_filter
    scan_topic: /scan
    odom_topic: /odom
    drive_topic: /drive

    # --- Control loop ---
    control_rate_hz: 40.0
    wheelbase: 0.324         # meters -- Traxxas 74276-4; matches vesc.yaml
    # Print every state change immediately, plus a periodic summary of the
    # path/LIDAR/opponent decision and final command. Set 0.0 for transitions only.
    decision_log_period_sec: 1.0

    # --- Drive intent (docs/drive-intent.md) ---
    # Publishes a JSON description of what this controller is trying to do
    # -- the predicted path along the racing line, the speed ceilings that
    # competed, and the reason for the current decision -- for the web
    # dashboard's intent arrow and decision panel. Read-only diagnostics:
    # it goes out only after the drive command for the tick has already
    # been published, and disables itself rather than the node if it ever
    # starts failing.
    publish_intent: true
    intent_topic: /drive_intent
    intent_rate_hz: 20.0
    # How far ahead the arrow predicts. The arrow's *length* is distance
    # travelled over this horizon, so a stopped car draws a stub and a fast
    # one draws a long arrow -- that is the intended reading. While the
    # racing line is being followed the prediction re-runs the pure pursuit
    # law at each sample, so the arrow bends through the corner ahead.
    intent_horizon_sec: 1.5
    intent_samples: 16
    # Never draw an arrow longer than this, however fast the plan is.
    intent_max_length: 8.0

    # --- Pure pursuit geometry ---
    # Validated headlessly on Spielberg, Silverstone, and Brands Hatch in
    # F1TENTH Gym; see docs/simulator.md for scenarios and limitations.
    min_lookahead: 0.6           # meters, lookahead distance at v=0
    max_lookahead: 1.5           # meters, lookahead distance cap at high speed
    lookahead_speed_gain: 0.15   # meters per (m/s): L_d = gain*v + min_lookahead, clipped to [min,max]
    nearest_search_window: 40    # +/- waypoints searched around the previous tick's nearest point (0 = search all)

    # --- Speed limits (safety ceiling -- the .csv profile is still clipped to this) ---
    max_speed: 4.0
    min_speed: 0.5
    # Runtime corrections/overtakes can be sharper than the profiled line.
    # Cap their speed from commanded curvature and shape normal commands.
    max_lateral_accel: 2.5     # m/s^2 -- online ceiling: v <= sqrt(a_lat/|kappa|)
    # m/s^2. Ceiling on how fast a speed *command* may rise. Not a demand on
    # the motor. Braking is never rate-limited on the way down.
    #
    # This value is bounded on BOTH sides and 6.0 is near the top of the
    # usable band -- do not raise it without re-running the traffic scenario.
    #   Too low  (3.0): the car cannot rebuild speed between safety stops and
    #                   stalls outright behind a slower car.
    #   Too high (7.0+): it arrives behind that slower car too fast for the
    #                   overtake to commit, hard-stops inside
    #                   emergency_stop_distance, and enters a stop-go cycle
    #                   it does not get out of.
    # 5.0 and 6.0 both pass; 7.0 fails. See docs/simulator.md.
    max_acceleration: 6.0
    max_braking_decel: 8.0     # m/s^2 -- only shapes normal commands; a safety stop is immediate
    max_steering_rate: 1.0     # rad/s -- caps steering slew between commands
    command_slew_max_dt: 0.10  # s -- longest interval a single slew step may integrate over
    # Fresh measured speed sizes lookahead; a stale/missing stream falls back
    # to the profiled target speed without weakening any existing watchdog.
    odom_timeout_sec: 0.5

    # --- Steering limit ---
    # Derived from this car's actual servo calibration in vesc.yaml:
    #   servo = -1.2135 * steering_angle + 0.5304, servo clamped to [0.15, 0.85]
    # Solving both ends: +0.313 rad at servo=0.15, -0.263 rad at servo=0.85.
    # Using the smaller magnitude (0.26) keeps every command physically
    # achievable in both directions, with a small margin. Re-derive this
    # if vesc.yaml's gain/offset/servo_min/servo_max ever change.
    max_steering_angle: 0.26

    # --- Safety watchdogs ---
    pose_timeout_sec: 0.5         # stop if localization hasn't updated within this long
    max_cross_track_error: 1.0    # stop if further than this from every waypoint (lost/kidnapped)

    # Frozen-localization watchdog. pose_timeout_sec above cannot catch a
    # pose that keeps *arriving* on time while no longer *tracking* the car
    # -- which is what auto_map_race_node republishing a stalled SLAM
    # transform looks like, and what drove the car into a wall on
    # 2026-07-27. Odometry is the independent witness: if it reports real
    # motion while the pose stands still, localization is lying.
    # Only armed above pose_frozen_min_speed, so a parked car never trips it;
    # at 0.30m/s the car covers 0.15m in 0.50s, 3x the 0.05m travel floor.
    pose_frozen_timeout_sec: 0.5
    pose_frozen_min_speed: 0.3
    pose_frozen_min_travel: 0.05

    # --- Rectangular collision envelope (matches gap_follow.yaml) ---
    # Traxxas 74276-4 is 0.535 x 0.281 m; this is the same intentionally
    # inflated 0.58 x 0.31 m envelope gap_follow uses. Feeds the all-round
    # body-clearance stop below, which -- unlike safety_fov_deg's forward
    # cone -- can see a wall the car is *alongside*.
    car_width: 0.31
    car_length: 0.58
    # All-direction contact floor measured from the body, not the sensor.
    # gap_follow uses 0.02m; 0.05m here because this controller is the one
    # travelling at racing speed, so it gets a slightly wider margin.
    emergency_stop_clearance: 0.05
    # Forward window for that check, matching gap_follow's forward_fov_deg.
    # NOT the full 270deg this Hokuyo sweeps: its rearmost beams look back
    # along the car and return its own chassis, which is inside the
    # footprint by construction and pins the car at a permanent negative
    # clearance. 180deg still covers both flanks, which is the point.
    body_clearance_fov_deg: 180.0

    # --- Reactive LIDAR safety net (independent of the planned line -- for
    # opponents, spun-out cars, or anything else not in the map) ---
    enable_lidar_safety: true
    safety_fov_deg: 60.0
    emergency_stop_distance: 0.4
    scan_timeout_sec: 0.5
    max_range: 10.0   # range readings beyond this (and inf/NaN) are clipped/filled before any math touches them

    # --- Reactive avoidance: steer *around* something in a wider cone,
    # instead of just stopping, whenever there's room to -- the hard-stop
    # net above still wins if it's too close for this to be safe. ---
    enable_obstacle_avoidance: true
    avoidance_fov_deg: 60.0
    # With map subtraction, this longer threshold applies only to an object
    # absent from the static map (such as another car), not track walls.
    avoidance_trigger_distance: 1.5
    # Before a map is available, raw scans cannot distinguish walls from
    # traffic. This shorter simulator-validated threshold limits false turns.
    avoidance_fallback_trigger_distance: 0.7
    avoidance_min_gap_distance: 1.0
    avoidance_speed: 1.0

    # --- Opponent detection, tracking, and overtaking -- see
    # docs/racing-autonomy.md's "Racing against opponents" for the full
    # strategy. Requires enable_lidar_safety above to also be true. ---
    enable_opponent_overtake: true
    opponent_min_width: 0.15          # meters -- narrower than this is noise/a thin post, not a car
    opponent_max_width: 0.7           # meters -- wider than this is treated as a wall, not a car
    opponent_cluster_gap: 0.3         # meters -- a range jump bigger than this splits one cluster into two
    opponent_engagement_range: 5.0    # meters -- ignore anything farther away for now
    opponent_open_side_margin: 0.5    # meters -- how much more open the surroundings must be to count as "isolated"
    opponent_velocity_smoothing: 0.3  # 0-1: higher = more responsive but noisier track-progress-rate estimate
    opponent_lost_timeout_sec: 1.0    # forget the tracked opponent if it isn't re-detected within this long
    overtake_trigger_gap: 3.0         # meters of *track distance* -- start considering a pass once this close
    overtake_closing_margin: 0.3      # m/s -- must be closing at least this fast to bother attempting a pass
    overtake_clear_margin: 1.0        # meters of track distance past the opponent before resuming the racing line
    overtake_lateral_offset: 0.35      # meters, sideways nudge to the steering target while passing
    # meters. While passing, the offset above is applied to a waypoint this
    # far ahead instead of the normal max_lookahead target, so reaching the
    # passing line is a gentle arc rather than a sharp turn the online
    # curvature speed cap would answer by braking. Must be >= max_lookahead.
    overtake_lookahead_distance: 4.0
    # Mid-pass the opponent is *expected* to leave the forward LIDAR cone
    # (it's alongside), so opponent_lost_timeout_sec deliberately does NOT
    # cancel an active overtake -- the pass completes on ego progress past
    # the opponent's dead-reckoned position instead. This is the hard cap:
    # blind for longer than this and the dead-reckoned position is no
    # longer trustworthy, so the pass is abandoned.
    overtake_max_blind_sec: 3.0
    laser_offset_x: 0.33              # meters -- estimated rear-axle base_link to LiDAR
    laser_offset_y: 0.0

    # --- How opponents are recognized in the scan ---
    # 'heuristic': cluster shape alone (car-sized, isolated) -- works with
    #     no map, but can be fooled by wall corners and clipped clusters.
    # 'map': ray-cast the scan the LIDAR *should* see from the current
    #     pose using the saved map (same range_libc library the particle
    #     filter uses), and flag whatever is meaningfully closer than the
    #     map predicts -- an opponent by definition, no shape guessing.
    #     Requires the map server running (it already is whenever the
    #     particle filter is); falls back to 'heuristic' with a warning
    #     until a map arrives. Still gated to car-plausible widths within
    #     opponent_engagement_range.
    # Map mode is the default after simulator validation; still validate it
    # wheels-off-ground and at low speed before relying on it physically.
    opponent_detection_mode: map
    map_topic: /map
    map_beam_step: 4              # ray-cast every Nth beam -- plenty for a car-sized object, keeps the per-tick cost tiny
    map_subtraction_margin: 0.4   # meters -- measured must be this much shorter than the map predicts to count as dynamic

    # --- Deadman button (workspace policy -- see docs/architecture.md) ---
    # Mandatory workspace-wide safety policy: the car must not move under
    # any code, autonomous or manual, unless LB is held on the physical
    # controller. This is checked first, ahead of every other watchdog
    # above. Stays enabled until the team has enough confidence in the
    # car's behavior to deliberately relax it -- don't set false otherwise.
    enable_deadman: true
    joy_topic: /joy
    deadman_button: 4
    joy_timeout_sec: 0.5
