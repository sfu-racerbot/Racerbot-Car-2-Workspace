# robot_localization ekf_node in SHADOW mode: it computes /odometry/filtered
# for comparison in bags and publishes NO transform. Nothing drives off it.
#
# Why publish_tf is false: only one node may own odom -> base_link, and
# vesc_to_odom_node owns it today (vesc.yaml publish_tf: true). Two owners
# fighting over one transform make every pose consumer jump between them.
# Handing it to this EKF is a separate, deliberate change (docs/localization.md).
#
# Why only vx and yaw rate: SLAM and the particle filter already turn wheel
# odometry + LiDAR into pose. Fusing a pose (or anything else they already
# use) here would count the same information twice and make the filter
# overconfident. Wheels are good at how fast; the gyro is the only thing on
# the car that measures how much it turned.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Rows: x y z / roll pitch yaw / vx vy vz / vroll vpitch vyaw / ax ay az
    # Wheel odometry: vx only. Its yaw rate comes from the steering command,
    # not a sensor, and its twist covariance is all zero at the source --
    # hence imu_bridge's republish with wheel_speed_sigma.
    odom0: /imu_bridge/wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: yaw rate only. No orientation (none is published), and no
    # acceleration: it is measured off the car's centre and would add
    # vibration noise for little gain at this stage.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
