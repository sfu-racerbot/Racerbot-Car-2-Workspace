# ============================================================================
# WANT THE CAR FASTER? Edit THIS file, not gap_follow_node.py.
#
# gap_follow_launch.py loads this file, and every value here overrides the
# declare_parameter() default in the .py -- so changing a number in the .py
# does nothing on the car. Restart the launch after editing (no rebuild
# needed with --symlink-install).
#
# The speed the car actually drives is the LOWEST of several caps, so raise
# the one that is binding. In rough order of how often each one binds:
#
#   corner_speed        cap whenever the car is in the corner fallback gap
#                       (on the 2026-08-06 run: ~80% of all driving ticks)
#   corner_speed_wide   the same cap on a corner sensed as wide
#   max_lateral_accel   curvature cap: v <= sqrt(max_lateral_accel / curvature).
#                       Since 2026-10-19 (2.0) this and the acceleration ramp
#                       are what bind most ticks in simulation. A grip limit --
#                       raise in small steps, and drop it back to 1.0 first if
#                       the car feels too fast in corners on the floor.
#   max_acceleration    SAFETY-CRITICAL: the braking the car assumes it has
#                       for the clearance it sees. Raising it lets the car
#                       drive faster than it can stop. Do not raise to go
#                       faster.
#   max_speed           cap on open straights
#
# Rule the node checks at startup, or it exits immediately:
#     corner_speed <= corner_speed_wide <= max_speed
# Mapping launches that cap max_speed scale the other two for you
# (gap_follow/speed_overrides.py).
#
# The live-tuning panel on the web dashboard can change corner_speed,
# max_speed and several others while the car runs; copy what works back
# here, since live changes are lost on restart.
#
# Any speed increase: test wheels-off first, then low speed in open space
# (docs/writing-your-own-node.md#testing-before-its-on-wheels).
# ============================================================================
gap_follow_node:
  ros__parameters:
    scan_topic: /scan
    drive_topic: /drive
    odom_topic: /odom
    max_range: 10.0
    forward_fov_deg: 180.0
    # Deliberately higher than the code default (1.0): with this car's top
    # speed and this room's clutter, an opening has to be at least this
    # deep before it's worth steering into.
    min_gap_distance: 2.0
    # If no 2m-deep gap exists at a blind/tight corner, accept a nearer
    # post-inflation corridor and crawl through it instead of deadlocking.
    fallback_min_gap_distance: 0.8
    # How much better a new candidate gap must score than the one
    # containing the previous tick's aim before the car re-aims at it --
    # see gap_logic.find_best_gap. Added after a real-hallway report of the
    # car "driving kind of drunk, side to side": gap selection had no
    # damping at all, unlike corridor centering's fade-in/out ramps, so two
    # similarly-scored candidates trading first place on ordinary LiDAR
    # noise could flip the steering command every scan. 1.2 is a bounded
    # first answer (needs a genuine 20% edge to win), not a value measured
    # against a real weaving log -- validate low-speed before trusting it.
    gap_switch_margin: 1.2
    # The cap that actually governs most of a lap here. On the 2026-08-06
    # run the car was in the corner fallback for ~120 of its ~150 driving
    # ticks, so it spent most of its time pinned to this value rather than to
    # max_speed. Raised with max_speed so corners are quicker, not just
    # straights; the curvature and clearance ceilings still apply on top.
    #
    # Raised again from 0.8 after a real-hallway report of corners taken
    # "too slowly and too tightly": 0.8 was the actual binding constraint
    # on that 2026-08-06 run (pinned there ~80% of the time), well below
    # what max_lateral_accel already permits independently -- at this
    # car's near-rack-limit corner curvature (~0.82/m, see
    # docs/asb-10000-sim-results.json), curvature_speed_limit alone already
    # caps speed to sqrt(max_lateral_accel / 0.82) =~ 1.1m/s, so raising
    # corner_speed to exactly that does not remove a safety ceiling, it
    # only stops being the *tighter* one for a car that can already go
    # this fast in that curvature on this car's own turning-circle math.
    # Not measured on this exact hallway -- validate low-speed first.
    #
    # Raised 2026-09-26 (1.1 -> 1.5, max 2.5 -> 3.5, min 0.8 -> 1.0) to make
    # the car faster. NOT yet validated on the car. Note max_lateral_accel
    # below still caps the tightest corners near 1.0 m/s (full lock 0.349).
    corner_speed: 1.5
    max_speed: 3.5
    min_speed: 1.0
    # 0.349 rad = 20 deg (was 0.26). Both sides reach ~25 deg since the
    # 2026-10-16 steering calibration (docs/hardware-reference.md); 20 leaves
    # 5 deg for the gain's error below 19 deg, where nothing was measured.
    max_steering_angle: 0.349
    # Steering is proportional to the selected gap's bearing, clipped to
    # max_steering_angle: 1.0 means "point the wheels at the gap". This
    # replaced a Pure Pursuit curvature law that could not physically ask for
    # more than ~0.11rad at the 13deg bearings this car sees in a corridor,
    # so it hugged walls instead of leaving them. Raise above 1.0 only if the
    # car is still slow to leave a wall; too high will make it weave.
    steering_gain: 1.0
    # Above this speed (m/s) the bearing gain falls as 1/speed, which keeps
    # the steering loop's phase margin roughly constant: with the 0.15 s
    # steering lag measured on run 20261019-200703 and full gain, the car
    # weaves at speed (docs/gap-follow.md).
    # 0 disables. Simulator-validated only.
    steering_gain_speed_ref: 1.8
    # Raised 1.0 -> 2.0 on 2026-10-19 with the swept-path / corner-setup
    # rework: 1.0 m/s^2 (~0.1 g) held the car near 1.4 m/s through every
    # corner. 2.0 is still below pure_pursuit's 2.5 on the same car and well
    # under the simulator's grip limit (0.7 g). Simulation only, not yet
    # validated on the floor -- see docs/gap-follow.md#validation.
    max_lateral_accel: 2.0
    max_acceleration: 3.0
    # SAFETY-CRITICAL, and NOT the same knob as pure_pursuit's identically
    # named one. Here it is the braking authority the car *assumes it has*
    # when deciding how fast it may drive for the clearance it can see
    # (v <= sqrt(2*a*(clearance - forward_stop_clearance))). Setting it above
    # what the car can really achieve makes it drive faster than it can stop.
    # In pure_pursuit the same name is only a command slew rate and carries no
    # such risk -- do not copy a value across from there.
    max_braking_decel: 3.0
    # The car keeps going at full speed for this long after a slower command:
    # ROS -> VESC transport plus the VESC speed loop. Measured ~0.28 s on run
    # 20261019-200703 (docs/run-analysis.md); the stopping-distance ceiling
    # subtracts speed * latency from the room it sees before applying
    # max_braking_decel. 0 restores the old formula. Simulator-validated only.
    braking_latency_sec: 0.25
    # Raised from 1.0 on 2026-10-20: at 1.0 rad/s the rack needs 0.35 s to
    # reach full lock, and in the recalibrated simulator square corners were
    # lost to that alone. The servo's real slew rate is not measured; the
    # simulator models it at 3.2 rad/s (vesc.yaml max_servo_speed, a smoother
    # bringup does not run). Simulator-validated only.
    max_steering_rate: 2.0
    # Never let a long scan pause turn into one unbounded command jump.
    command_slew_max_dt: 0.10
    # Hold the lowest desired speed of this many seconds instead of following
    # every scan's ceiling up and down: the car's speed loop takes ~0.3 s to
    # answer, so chasing each wobble means accelerating into a dip and braking
    # out of it. Only ever lowers speed. 0 disables. Simulator-validated only.
    speed_hold_sec: 0.0
    # Narrow-corridor ceiling (2026-10-20), the condition the TTC corridor
    # change was approved on: the speed falls linearly from max_speed when the
    # body is open_corridor_clearance (m) from the nearer side wall, to
    # narrow_corridor_speed at narrow_corridor_clearance and below. Replaces
    # the hard stops the old 0.18 m TTC corridor made for side walls with a
    # smooth slowdown. narrow_corridor_speed >= max_speed turns it off.
    # Simulator-validated only.
    narrow_corridor_speed: 2.5
    narrow_corridor_clearance: 0.05
    open_corridor_clearance: 0.15
    # --- Rectangular vehicle footprint ---
    # Measured on this car with a tape, 2026-08-24, NOT the Traxxas 74276-4
    # published figures the earlier values came from:
    #   wheelbase      0.36 m   front axle to rear axle (Traxxas says 0.324)
    #   width          0.30 m   outer edge of tire to outer edge of tire --
    #                           the tires, not the shell, are the widest part
    #   laser_offset_x 0.26 m   = 0.36 - 0.10; the LiDAR sits 0.10 m behind
    #                           the FRONT AXLE. The old 0.33 m assumed 0.10 m
    #                           behind the NOSE, a different reference point.
    # car_width's padding was cut from 14.5mm/side to 5mm/side on
    # 2026-08-25: real run logs showed emergency_clearance latching at
    # -10mm to -13mm with nothing actually in contact, tracking the old
    # 14.5mm padding almost exactly -- so 0.30 measured plus 5mm a side is
    # 0.31. Still an envelope, not a measurement, just a tighter one.
    # (The pre-2026-08-24 car_width was also 0.31 -- 14.5mm padding on the
    # wrong 0.281m Traxxas body figure. Same digits, unrelated derivation.)
    # car_length is UNCHANGED because nobody has measured this car bumper to
    # bumper; 0.58 still contains it under the published overhang, but with
    # ~4.5 mm an end rather than the 22.5 mm it was designed for. Measure
    # rear-axle-to-nose and revisit.
    car_width: 0.31
    car_length: 0.58
    wheelbase: 0.36
    laser_offset_x: 0.26
    laser_offset_y: 0.0
    # Padding added to half the car width when inflating obstacle edges
    # (disparity_extend) and when sizing the safety bubble. This is the knob
    # that decides how wide a berth the chosen gap gives the inside of a
    # corner: the extension is car_width/2 + safety_margin, so 0.18 moves the
    # drivable window 0.345m off every edge instead of 0.265m. Raised because
    # the car was clipping corner apexes and then sitting ~0.08m off the wall.
    # Costs gap width, so raise it further only alongside
    # min_centerline_gap_width / fallback_min_gap_distance.
    safety_margin: 0.18
    # --- Adaptive corridor width (docs/asb-10000-sim-results.json) ---
    # Live per-tick ceiling on corner_speed (and, if configured to, a floor
    # on safety_margin), from the same side_wall_distance measurement
    # corridor centering already takes. Measured on indoor_wide: a clean
    # win, ~9% higher average speed with wall contact still zero, since it
    # never touches the margin there.
    #
    # min_safety_margin below defaults to safety_margin, i.e. margin
    # shrinking is a no-op out of the box: measured on the ASB 10000-level
    # course's real 1.5m hallway (uniformly narrow, not narrow-in-spots),
    # shrinking the margin there sensed as "narrow" almost continuously and
    # just drove the car permanently closer to the walls -- wall contact
    # rose with no speed or distance gain, because what limited that course
    # was corner curvature near the car's own turning circle, not a
    # margin-driven "no gap found" stop. Lower min_safety_margin in a
    # per-course config only where the geometry is narrow-in-spots, not
    # narrow throughout.
    #
    # Deliberately config-only, not in live_tuning's dashboard catalogue:
    # min_safety_margin and corner_speed_wide are coupled to safety_margin/
    # corner_speed/max_speed (gap_follow_node._validate_adaptive_width_
    # parameters), and those three are already live-tunable. Restart to
    # change this rather than risk the pair drifting out of the relation
    # the node checked at startup.
    enable_adaptive_width: true
    # Sensed corridor width (left + right side distance) at or below which
    # corner_speed tops out (and the margin would bottom out, if lowered
    # below safety_margin). 1.4m is indoor_tight's corridor -- the
    # narrowest layout already validated in the simulator
    # (src/racerbot_sim/racerbot_sim/tracks.py).
    adaptive_width_narrow: 1.4
    # Sensed width at or above which nothing changes: both values are
    # exactly today's static defaults. 2.6m is indoor_wide's corridor --
    # the one those defaults are already tuned against.
    adaptive_width_reference: 2.6
    # Off by default -- see the comment above enable_adaptive_width. NOT the
    # old pre-0.18 regime if you do lower this for a course: safety_margin's
    # own comment above records that a smaller margin than today's default
    # left the car "clipping corner apexes and then sitting ~0.08m off the
    # wall".
    min_safety_margin: 0.18
    # The ceiling corner_speed may rise to on a sensed-wide bend -- one the
    # fallback gap took for lack of forward visibility, not lack of room.
    # corner_speed itself remains the floor; this only ever adds capability.
    #
    # Bounded above by max_speed, which the mapping launch files lower. They
    # scale this and corner_speed by the same factor to keep the relation
    # (gap_follow/speed_overrides.py); raising either of these without
    # checking that helper is how gap_follow_node came to exit at startup on
    # 2026-08-19, which stalled a whole auto_map_race run.
    # 1.9 on 2026-09-26: raised with corner_speed (1.1 -> 1.5) at the same
    # 1.4/1.1 ratio, because corner_speed <= corner_speed_wide is checked
    # at startup and 1.5 against the old 1.4 would stop the node.
    corner_speed_wide: 1.9
    disparity_threshold: 0.4
    # Obstacles are already inflated by half-width + margin on both sides.
    # Requiring another car width here was double-padding tight openings.
    min_centerline_gap_width: 0.10
    # All-direction final contact floor, measured from the padded body.
    # Dropped from 0.02 to 0.0 on 2026-08-25: real run logs showed this
    # latching at -10mm to -13mm of "clearance" with nothing actually in
    # contact -- false positives tracking the 14.5mm/side padding just cut
    # from car_width above almost exactly, not real near-misses. Validate
    # in racerbot_sim; if LiDAR-noise chatter shows up at 0.0, the
    # documented fallback is 0.01, not the old 0.02.
    emergency_stop_clearance: 0.0
    # Odom-independent fallback ahead of the car. Keeping this to a narrow
    # cone avoids treating a close side wall in a corner as a frontal hazard.
    # Cut from 0.25 to 0.20 on 2026-08-25: the 0.25m reserve was putting
    # ordinary cornering, not just genuine near-misses, into the
    # escape_creep_speed regime below -- a plausible source of a real report
    # of the car "inching" around corners.
    forward_stop_clearance: 0.20
    forward_stop_fov_deg: 60.0
    # Inside forward_stop_clearance the car crawls at this speed instead of
    # latching at zero. That cone points where the car is aimed, not where it
    # is going, so a car turning out of a corner used to be frozen by the wall
    # it was already steering around -- with no way back out, since stopping
    # removes the motion that would clear the cone. Contact clearance, TTC and
    # the no-gap stop all still stop the car outright; this only lets a car
    # that has found an exit inch toward it.
    # Raised from 0.25 to 0.40 on 2026-08-25, directly addressing a real
    # report of this crawl itself feeling like "inching" -- still within the
    # node's own validated bound (0.0 < escape_creep_speed <=
    # max(min_speed, 0.5), checked at startup), a pure config change with
    # no code implication.
    escape_creep_speed: 0.40

    # --- Cornering anticipation ---
    # An extra speed cap from how much the chosen gap's near-only bearing
    # disagrees with aim_within_gap's own choice -- see
    # gap_follow_node.py's comment on this declared parameter for the full
    # reasoning and the mechanism this is meant to add.
    #
    # Ships OFF: measured on indoor_wide (0 wall contact either way), this
    # capped speed on 49 of 65 driving ticks and was the actually-binding
    # cap on most of them, for about a 25% average speed drop versus the
    # same run with only the corner_speed_wide change above -- a wide
    # gap's own angular span naturally leans toward whichever edge is more
    # open, which reads as "a bend is coming" even in a straight, open
    # room. Needs a better-normalized trigger before this is worth
    # enabling; the mechanism and its tests stay in place for that.
    enable_cornering_anticipation: false
    # Deliberately above min_gap_distance (2.0m) -- see the code comment
    # next to this parameter's declaration in gap_follow_node.py for why
    # a value below it would make the whole feature silently inert until
    # the car was already committed to the fallback gap. 2.5m matches
    # centering_full_forward_depth's own "genuine stretch ahead" threshold.
    anticipation_near_depth: 2.5

    # --- Corridor centering on straights ---
    # Follow-the-gap only ever answers "which way do I point". On a straight
    # the answer is "down the corridor", which is parallel to both walls -- so
    # the car keeps whatever lateral offset it entered the straight with and
    # will happily run a whole straight 15cm off one wall. This adds the
    # missing cross-track term: a small steering bias toward the middle,
    # faded out as soon as the car is actually turning so it never argues with
    # the gap choice in a corner. See gap_logic.corridor_centering_bias.
    enable_centering: true
    # rad per meter of offset from the corridor middle. With the 0.08rad clamp
    # below, this saturates at 0.32m off centre. Raise for a firmer pull to the
    # middle; too high will weave, because the pull and the bearing term then
    # fight each other faster than max_steering_rate can settle.
    centering_gain: 0.25
    # SAFETY-RELEVANT: the hard authority bound on the bias. The node refuses
    # to start if this exceeds half of max_steering_angle -- centering is a
    # refinement of the gap the obstacle-avoidance pipeline already chose, and
    # a bias big enough to cancel that choice would be a second driving policy.
    centering_max_steering: 0.08
    # Width of the angular window centred on each of +/-90deg used to measure
    # the wall beside the car. The minimum range inside the window is the
    # perpendicular distance, so this width is really the yaw tolerance: 60deg
    # keeps the estimate correct up to +/-30deg of yaw relative to the wall.
    # Measured against the full 270deg scan, not the 180deg forward window.
    centering_side_fov_deg: 60.0
    # "Not actively turning": full centering at or below the first bearing,
    # none at or above the second, linear between. A ramp rather than a switch
    # -- a hard on/off on a steering term is what caused the scan-rate chatter
    # documented in gap_follow_node._aim_within_gap.
    centering_full_bearing_deg: 4.0
    centering_zero_bearing_deg: 15.0
    # There has to be a straight worth centring in. Faded out as the aimed-at
    # depth drops, so the car stops centring on approach to a corner.
    centering_full_forward_depth: 2.5
    centering_zero_forward_depth: 1.5
    # Both sides must be a real wall. Past this the "wall" is a doorway, an
    # opening, or max_range, and centring against it would steer the car into
    # the opening. Deliberately well above any plausible corridor width and
    # well below max_range (10.0): the wall-hugging this fixes happens in the
    # *wide* corridors, where the aim is the deepest beam and therefore
    # parallel to the walls. In a corridor narrow enough that both gap edges
    # are real obstacles, the existing midpoint aim is already correcting, and
    # this term only trims what it leaves behind.
    centering_full_side_distance: 4.0
    centering_zero_side_distance: 5.0

    # --- Swept-path clearance (docs/gap-follow.md#swept-path-clearance) ---
    # The braking speed ceiling uses how far the BODY can drive along the arc
    # it is on before reaching an obstacle, instead of the minimum range in
    # the +/-30deg forward cone. In a 1.5m hallway that cone reads the side
    # walls (~1.25m) and capped the car at ~2.4m/s on empty straights.
    # Creeping and the escape logic still use the cone, unchanged.
    enable_swept_clearance: true
    # Extra width on each side of the body counted as "in the path". Small on
    # purpose: the 0.20m forward_stop_clearance reserve is the longitudinal
    # margin, and the TTC brake has its own corridor (ttc_path_margin).
    swept_clearance_margin: 0.05
    swept_clearance_max_length: 3.0   # m -- beyond this the path counts as clear

    # --- Arc guard (docs/gap-follow.md#arc-guard) ---
    # If the steering the gap logic asks for would sweep the body into
    # something within arc_guard_length (or the stopping distance, if longer),
    # use the nearest steering angle whose arc is clear. This is what stops
    # the rear of the car clipping an inner corner. Never acts on open track.
    enable_arc_guard: true
    arc_guard_length: 1.0          # m
    arc_guard_margin: 0.05         # m each side of the body
    # Authority bound, checked at startup: at most half of max_steering_angle.
    arc_guard_max_correction: 0.1745
    arc_guard_candidates: 29       # steering angles tried across the full range
    # When no arc within the bound is clear: 'freest' takes the one with the
    # most free length, 'request' leaves the gap's own choice. 'freest' can
    # unwind a needed turn into the outer wall (docs/gap-follow.md).
    arc_guard_blocked_fallback: request

    # --- Corner setup (docs/gap-follow.md#corner-setup) ---
    # On the approach to a turn in a corridor, move toward the OUTSIDE wall so
    # the car turns in late (a racing line) instead of hugging the inside from
    # the moment the bend appears. Off on straights and in open rooms.
    enable_corner_setup: true
    # Target position: this fraction of the room between the middle and the
    # outside wall (room = corridor_half - car_width/2 - wall_margin).
    corner_setup_fraction: 0.6
    corner_setup_wall_margin: 0.10
    corner_setup_gain: 0.6            # rad per m of lateral error
    # Authority bound, checked at startup: at most half of max_steering_angle.
    corner_setup_max_steering: 0.10
    # Turn detection (gap_logic.side_opening_signal): in a forward-diagonal
    # sector on each side, the fraction of beams that reach more than
    # excess_threshold past where that side's wall would be if it carried on
    # -- i.e. that see around the end of the wall. Left fraction minus right.
    # Setup starts at zero_signal and is fully on at full_signal.
    corner_setup_zero_signal: 0.03
    corner_setup_full_signal: 0.12
    corner_setup_sector_lo_deg: 10.0
    corner_setup_sector_hi_deg: 80.0
    corner_setup_excess_threshold: 0.30   # m
    # Distance the body can drive straight ahead (to the end of the straight):
    # setup fades in from far_zero to far_full, and back out from near_full to
    # near_zero, which is the turn-in point -- below it the car must be free
    # to turn. Must satisfy near_zero < near_full <= far_full < far_zero.
    corner_setup_far_zero: 4.0
    corner_setup_far_full: 2.5
    corner_setup_near_full: 1.6
    corner_setup_near_zero: 1.1
    # Both side walls must be within this (corridor, not open room).
    corner_setup_full_side_distance: 1.5
    corner_setup_zero_side_distance: 2.5

    # --- Opponent awareness: other cars on track (simulator-validated only) ---
    # Off by default: with one car on track nothing below runs, and the
    # node's commands are identical to having no such feature
    # (test_opponent_awareness_off_is_identical). Turn it on when two or
    # more cars share the track. What it does: finds free-standing,
    # car-sized clusters in the scan, tracks them across scans against this
    # car's dead-reckoned motion, and for those that MOVE (a parked car is
    # just an obstacle, as before) it (1) makes the gap search treat the
    # space the car will occupy over the next prediction_horizon as blocked,
    # widened by passing_margin, so it only passes with real room, and (2)
    # caps speed to (gap - follow_min_gap) / follow_time_gap behind one
    # ahead in the path. TTC, contact, swept-path and arc-guard checks keep
    # reading the real scan. Full write-up and simulator results:
    # docs/gap-follow.md#several-cars-at-once. Nothing here is car-tested.
    enable_opponent_awareness: false
    opponent_min_width: 0.15         # m, smallest cluster chord that can be a car
    opponent_max_width: 0.70         # m, a 0.30 x 0.58 car seen diagonally
    opponent_max_range: 6.0          # m
    opponent_segment_jump: 0.25      # m, range step between two objects
    opponent_min_beams: 3
    opponent_gate: 0.5               # m, scan-to-scan association radius (+ v*dt)
    opponent_alpha: 0.5              # position filter gain
    opponent_beta: 0.15              # velocity filter gain
    opponent_min_hits: 8             # scans (0.2 s) before a track may count as moving
    opponent_max_misses: 6           # scans unseen before a track is dropped
    opponent_moving_speed: 0.6       # m/s over the ground; odometry error makes walls drift ~0.2-0.4
    opponent_radius: 0.30            # m, footprint around the cluster centre
    opponent_passing_margin: 0.15    # m, extra room demanded beside a moving car
    opponent_prediction_horizon: 0.8 # s of predicted path treated as blocked
    opponent_prediction_step: 0.1    # s
    opponent_follow_min_gap: 0.5     # m, bumper gap at which the follow cap reaches 0
    opponent_follow_time_gap: 1.0    # s: 0.6 stalled 6 of 8 two-car runs on the 1.2 m loop, 1.0 none
    opponent_follow_lateral: 0.45    # m, |y| within which a car ahead is "in the path"
    opponent_relevant_lateral: 1.0   # m, |y| beyond which a moving car is ignored
    opponent_pass_max_steering: 0.10 # rad, no new pass while steering harder (a bend)
    opponent_pass_max_heading_deg: 15.0  # no new pass while the car ahead turns more
    opponent_max_track_speed: 8.0    # m/s, clamp on the velocity estimate
    # The rack the dead reckoning turns with: the command delayed and slewed
    # like the servo, not the command itself, which made parked clutter 0.9 m
    # away read as a 1 m/s car. Fitted to run 20261019-200703, same values as
    # tools/f1tenth_sim/sim_fidelity/calibration.py.
    opponent_steer_delay: 0.075      # s (steering_delay_ticks 3 at 40 Hz)
    opponent_steer_gain: 15.0        # 1/s (steering_servo_gain)
    opponent_steer_rate_max: 3.2     # rad/s (steering_rate_max)

    # --- Time-to-collision automatic emergency braking ---
    enable_ttc: true
    # Lowered from 0.5, then again from 0.35 on 2026-08-25. At the 1.6m/s
    # this car actually reaches, 0.5s meant braking 0.80m from a wall while
    # mid-corner; 0.35s brakes at 0.56m; 0.30s brakes at 0.48m, which still
    # exceeds the 0.43m the clearance ceiling reserves to stop from that
    # speed at max_braking_decel. The clearance-based stops are unchanged.
    # The 2026-08-25 cut was prompted by a real trip that fired with only a
    # ~2ms margin against the computed collision time at the old 0.35s
    # threshold -- and per section 2's directional escape gate, most TTC
    # trips now attempt to crawl out through a visible gap rather than
    # braking to zero at all, so a trip that still does hard-stop is one
    # that was genuinely boxed in.
    ttc_threshold_sec: 0.30
    # TTC counts an obstacle only if it lies within car_width/2 + this of the
    # arc the car is on. It was the full safety_margin (0.18) until
    # 2026-10-20; on the 2026-10-19 run every one of the 97 TTC stop ticks
    # was the inside wall of a bend 0.12-0.18 m outside the body, which the
    # car was passing, not approaching. Approved change; simulator-validated
    # and checked against that run's scans only -- see docs/gap-follow.md.
    ttc_path_margin: 0.05
    ttc_min_closing_speed: 0.05
    # TTC uses max(fresh odom speed, latest command when it is positive),
    # so brief odom under-reporting cannot suppress braking. A zero brake
    # command supersedes the previous positive command instead of latching it.
    ttc_command_speed_timeout_sec: 0.5
    # Once fresh odom reports meaningful motion, use it rather than the much
    # higher requested speed; this prevents stop/restart latching in corners.
    ttc_command_fallback_max_odom_speed: 0.10
    # Speed below which the TTC brake is not armed at all. TTC measures
    # closing speed, and at a crawl it stops measuring anything useful: on the
    # 2026-08-06 run 10 of 12 sampled TTC stops fired between 0.15 and
    # 0.39m/s, where the old 0.5s threshold is just 0.08-0.20m of clearance,
    # so a car that had eased up to a corner wall could never re-commit. Some
    # of those samples read "odom 0.00m/s, recent command 0.16m/s" -- stopped,
    # braking on its own commanded speed, releasing, re-braking at scan rate.
    # Below this speed the clearance layers own the car instead, and they are
    # the ones designed to let it escape: emergency_stop_clearance still stops
    # on contact, and the forward reserve still creeps toward a visible exit.
    ttc_min_brake_speed: 0.6
    odom_timeout_sec: 0.5
    # --- Deadman button (workspace policy -- see docs/architecture.md) ---
    # Mandatory workspace-wide safety policy: the car must not move under
    # any code, autonomous or manual, unless LB is held on the physical
    # controller. Stays enabled until the team has enough confidence in
    # the car's behavior to deliberately relax it -- don't set false
    # otherwise.
    enable_deadman: true
    joy_topic: /joy
    deadman_button: 4
    joy_timeout_sec: 0.5

    # --- Drive intent (docs/drive-intent.md) ---
    # Publishes a JSON description of what this controller is trying to do
    # -- the predicted path, the speed ceilings that competed, and the
    # reason for the current decision -- for the web dashboard's intent
    # arrow and decision panel. Read-only diagnostics: it goes out only
    # after the drive command for the tick has already been published, and
    # disables itself rather than the node if it ever starts failing.
    publish_intent: true
    intent_topic: /drive_intent
    # Well under the ~40Hz scan rate; no browser needs to redraw an arrow
    # faster than this, and the Jetson is also driving the car.
    intent_rate_hz: 20.0
    # How far ahead the arrow predicts. The arrow's *length* is distance
    # travelled over this horizon, so a stopped car draws a stub and a fast
    # one draws a long arrow -- that is the intended reading.
    intent_horizon_sec: 1.5
    intent_samples: 16
    # Never draw an arrow longer than this, however fast the plan is; past
    # a certain length it stops being informative and just covers the map.
    intent_max_length: 8.0

    # --- Terminal diagnostics ---
    # Every state change prints immediately. While the state is unchanged,
    # repeat the current stop/drive reason and final command at this rate.
    # Set 0.0 for transitions only.
    decision_log_period_sec: 1.0
    # Gap follow is driven by scan callbacks, so a dead scan makes /drive go
    # quiet. The status timer uses this threshold to report it. Nothing in
    # ROS publishes a zero then: only the VESC's own command timeout stops it.
    scan_timeout_sec: 0.5
