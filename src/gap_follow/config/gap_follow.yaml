gap_follow_node:
  ros__parameters:
    scan_topic: /scan
    drive_topic: /drive
    odom_topic: /odom
    max_range: 10.0
    forward_fov_deg: 180.0
    # Deliberately higher than the code default (1.0): with this car's top
    # speed and this room's clutter, an opening has to be at least this
    # deep before it's worth steering into.
    min_gap_distance: 2.0
    # If no 2m-deep gap exists at a blind/tight corner, accept a nearer
    # post-inflation corridor and crawl through it instead of deadlocking.
    fallback_min_gap_distance: 0.8
    corner_speed: 0.5
    max_speed: 2.0
    min_speed: 0.8
    # Symmetric achievable envelope from the calibrated servo mapping.
    max_steering_angle: 0.26
    # Steering is proportional to the selected gap's bearing, clipped to
    # max_steering_angle: 1.0 means "point the wheels at the gap". This
    # replaced a Pure Pursuit curvature law that could not physically ask for
    # more than ~0.11rad at the 13deg bearings this car sees in a corridor,
    # so it hugged walls instead of leaving them. Raise above 1.0 only if the
    # car is still slow to leave a wall; too high will make it weave.
    steering_gain: 1.0
    max_lateral_accel: 1.0
    max_acceleration: 3.0
    # SAFETY-CRITICAL, and NOT the same knob as pure_pursuit's identically
    # named one. Here it is the braking authority the car *assumes it has*
    # when deciding how fast it may drive for the clearance it can see
    # (v <= sqrt(2*a*(clearance - forward_stop_clearance))). Setting it above
    # what the car can really achieve makes it drive faster than it can stop.
    # In pure_pursuit the same name is only a command slew rate and carries no
    # such risk -- do not copy a value across from there.
    max_braking_decel: 3.0
    max_steering_rate: 1.0
    # Never let a long scan pause turn into one unbounded command jump.
    command_slew_max_dt: 0.10
    # --- Rectangular vehicle footprint ---
    # Traxxas 74276-4 is 0.535 x 0.281 m; retain this intentionally inflated
    # 0.58 x 0.31 m collision envelope. Its published wheelbase is 0.324 m.
    # LiDAR x ~= 0.33 m estimates a mount about 0.10 m behind the physical nose.
    car_width: 0.31
    car_length: 0.58
    wheelbase: 0.324
    laser_offset_x: 0.33
    laser_offset_y: 0.0
    safety_margin: 0.10
    disparity_threshold: 0.4
    # Obstacles are already inflated by half-width + margin on both sides.
    # Requiring another car width here was double-padding tight openings.
    min_centerline_gap_width: 0.10
    # All-direction final contact floor, measured from the padded body.
    emergency_stop_clearance: 0.02
    # Odom-independent fallback ahead of the car. Keeping this to a narrow
    # cone avoids treating a close side wall in a corner as a frontal hazard.
    forward_stop_clearance: 0.25
    forward_stop_fov_deg: 60.0
    # Inside forward_stop_clearance the car crawls at this speed instead of
    # latching at zero. That cone points where the car is aimed, not where it
    # is going, so a car turning out of a corner used to be frozen by the wall
    # it was already steering around -- with no way back out, since stopping
    # removes the motion that would clear the cone. Contact clearance, TTC and
    # the no-gap stop all still stop the car outright; this only lets a car
    # that has found an exit inch toward it.
    escape_creep_speed: 0.25

    # --- Corridor centering on straights ---
    # Follow-the-gap only ever answers "which way do I point". On a straight
    # the answer is "down the corridor", which is parallel to both walls -- so
    # the car keeps whatever lateral offset it entered the straight with and
    # will happily run a whole straight 15cm off one wall. This adds the
    # missing cross-track term: a small steering bias toward the middle,
    # faded out as soon as the car is actually turning so it never argues with
    # the gap choice in a corner. See gap_logic.corridor_centering_bias.
    enable_centering: true
    # rad per meter of offset from the corridor middle. With the 0.08rad clamp
    # below, this saturates at 0.32m off centre. Raise for a firmer pull to the
    # middle; too high will weave, because the pull and the bearing term then
    # fight each other faster than max_steering_rate can settle.
    centering_gain: 0.25
    # SAFETY-RELEVANT: the hard authority bound on the bias. The node refuses
    # to start if this exceeds half of max_steering_angle -- centering is a
    # refinement of the gap the obstacle-avoidance pipeline already chose, and
    # a bias big enough to cancel that choice would be a second driving policy.
    centering_max_steering: 0.08
    # Width of the angular window centred on each of +/-90deg used to measure
    # the wall beside the car. The minimum range inside the window is the
    # perpendicular distance, so this width is really the yaw tolerance: 60deg
    # keeps the estimate correct up to +/-30deg of yaw relative to the wall.
    # Measured against the full 270deg scan, not the 180deg forward window.
    centering_side_fov_deg: 60.0
    # "Not actively turning": full centering at or below the first bearing,
    # none at or above the second, linear between. A ramp rather than a switch
    # -- a hard on/off on a steering term is what caused the scan-rate chatter
    # documented in gap_follow_node._aim_within_gap.
    centering_full_bearing_deg: 4.0
    centering_zero_bearing_deg: 15.0
    # There has to be a straight worth centring in. Faded out as the aimed-at
    # depth drops, so the car stops centring on approach to a corner.
    centering_full_forward_depth: 2.5
    centering_zero_forward_depth: 1.5
    # Both sides must be a real wall. Past this the "wall" is a doorway, an
    # opening, or max_range, and centring against it would steer the car into
    # the opening. Deliberately well above any plausible corridor width and
    # well below max_range (10.0): the wall-hugging this fixes happens in the
    # *wide* corridors, where the aim is the deepest beam and therefore
    # parallel to the walls. In a corridor narrow enough that both gap edges
    # are real obstacles, the existing midpoint aim is already correcting, and
    # this term only trims what it leaves behind.
    centering_full_side_distance: 4.0
    centering_zero_side_distance: 5.0

    # --- Time-to-collision automatic emergency braking ---
    enable_ttc: true
    ttc_threshold_sec: 0.5
    ttc_min_closing_speed: 0.05
    # TTC uses max(fresh odom speed, latest command when it is positive),
    # so brief odom under-reporting cannot suppress braking. A zero brake
    # command supersedes the previous positive command instead of latching it.
    ttc_command_speed_timeout_sec: 0.5
    # Once fresh odom reports meaningful motion, use it rather than the much
    # higher requested speed; this prevents stop/restart latching in corners.
    ttc_command_fallback_max_odom_speed: 0.10
    odom_timeout_sec: 0.5
    # --- Deadman button (workspace policy -- see docs/architecture.md) ---
    # Mandatory workspace-wide safety policy: the car must not move under
    # any code, autonomous or manual, unless LB is held on the physical
    # controller. Stays enabled until the team has enough confidence in
    # the car's behavior to deliberately relax it -- don't set false
    # otherwise.
    enable_deadman: true
    joy_topic: /joy
    deadman_button: 4
    joy_timeout_sec: 0.5

    # --- Drive intent (docs/drive-intent.md) ---
    # Publishes a JSON description of what this controller is trying to do
    # -- the predicted path, the speed ceilings that competed, and the
    # reason for the current decision -- for the web dashboard's intent
    # arrow and decision panel. Read-only diagnostics: it goes out only
    # after the drive command for the tick has already been published, and
    # disables itself rather than the node if it ever starts failing.
    publish_intent: true
    intent_topic: /drive_intent
    # Well under the ~40Hz scan rate; no browser needs to redraw an arrow
    # faster than this, and the Jetson is also driving the car.
    intent_rate_hz: 20.0
    # How far ahead the arrow predicts. The arrow's *length* is distance
    # travelled over this horizon, so a stopped car draws a stub and a fast
    # one draws a long arrow -- that is the intended reading.
    intent_horizon_sec: 1.5
    intent_samples: 16
    # Never draw an arrow longer than this, however fast the plan is; past
    # a certain length it stops being informative and just covers the map.
    intent_max_length: 8.0

    # --- Terminal diagnostics ---
    # Every state change prints immediately. While the state is unchanged,
    # repeat the current stop/drive reason and final command at this rate.
    # Set 0.0 for transitions only.
    decision_log_period_sec: 1.0
    # Gap follow is driven by scan callbacks, so a dead scan makes /drive go
    # quiet. The status timer uses this threshold to explain that mux stop.
    scan_timeout_sec: 0.5
