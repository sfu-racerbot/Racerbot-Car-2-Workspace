/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5304

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    # LOCAL FIX (this car) -- see docs/git-setup.md before syncing upstream.
    # vesc_to_odom.cpp computes  speed = (-state.speed - offset) / gain,
    # i.e. it hardcodes a negation of the eRPM the VESC reports. This car's
    # VESC already reports eRPM with the same sign as the commanded eRPM, so
    # that negation makes /odom report NEGATIVE linear.x while the car drives
    # FORWARD, and integrates the odom->base_link TF backwards with it.
    # Negating the gain here -- and only here; the shared /** block keeps
    # +4614.0 for ackermann_to_vesc_node, which sets the motor command --
    # cancels it, so forward is positive again.
    # Evidence (2026-07-27 gap_follow collision log): commanded +1.86m/s with
    # /odom reading -1.76m/s while the car closed on a wall directly ahead;
    # magnitudes tracked the command within ~5% throughout.
    speed_to_erpm_gain: -4614.0
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # Measured on this car, 2026-08-24: 360 mm, front axle to rear axle.
    # NOT the 324 mm Traxxas publishes for a stock 74276-4 -- this one is
    # 36 mm longer between the axles, and vesc_to_odom integrates heading
    # as speed * tan(steering) / wheelbase, so the old figure turned every
    # commanded steering angle into ~11% more yaw than the car produces.
    # base_link stays at the rear axle, which is what that model assumes.
    # See docs/hardware-reference.md; keep in step with gap_follow.yaml,
    # pure_pursuit.yaml, auto_map_race.yaml and odom_calibration.yaml.
    wheelbase: 0.36

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec