usb_cam_stream_node:
  ros__parameters:
    # --- Source: the RealSense's color topic, NOT a V4L2 device ---
    # realsense2_camera_node holds the D435i's /dev/videoN open exclusively,
    # so this instance subscribes to the frames it already publishes instead
    # (see docs/realsense-camera.md). Requires
    # `ros2 launch racerbot_launch realsense_camera_launch.py` to be running.
    image_topic: /camera/camera/color/image_raw

    # --- Web server ---
    # Port 9090 is the MJPEG port web_dashboard's camera panel looks for
    # (see dashboard.js) -- don't also run usb_cam_stream_launch.py (the
    # UVC-webcam variant) at the same time, both default to this port.
    host: 0.0.0.0   # listen on every interface -- see docs/usb-camera-livestream.md's security note
    port: 9090
    stream_fps: 30.0   # a cap: frames are pushed as soon as they exist

    # Two tiers -- see docs/usb-camera-livestream.md. /stream is the small
    # preview the dashboard inset uses; /stream?tier=full is the recording
    # view. A tier nobody is watching is never encoded.
    preview_width: 480
    preview_quality: 65
    full_width: 0
    full_quality: 90
    # No effect in image_topic mode: frames arrive already decoded, so
    # there is no camera JPEG to pass through.
    passthrough: false

    # --- Terminal diagnostics ---
    frame_timeout_sec: 2.0      # warn if the image topic stops producing frames
    status_log_period_sec: 5.0  # repeat healthy/fault state (0 = state changes only)
