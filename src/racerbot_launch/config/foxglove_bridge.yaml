# foxglove_bridge, as this car runs it for Lichtblick through
# dashboard.sfuracerbot.ca. Started by foxglove_bridge_launch.py in this
# package, or by tools/systemd/foxglove-bridge.service.
#
# Written against ros-jazzy-foxglove-bridge 3.5.0. Every key below is a
# parameter that version actually declares (read from its
# foxglove_bridge_launch.xml and the strings in
# libfoxglove_bridge_component.so, 2026-09-26) -- not names from older
# docs. After an apt upgrade, re-check with:
#   ros2 param list /foxglove_bridge
#
# Plain-language walkthrough: docs/foxglove-bridge.md.
foxglove_bridge:
  ros__parameters:
    # --- Where it listens ---
    # Loopback only. The only way in from off the car is the Cloudflare
    # Tunnel (rb2-bridge-origin.sfuracerbot.ca -> 127.0.0.1:8765), which
    # sits behind Cloudflare Access. Nothing on the LAN or Tailscale can
    # reach it directly -- deliberately, because what it exposes (below)
    # is far broader than the web dashboard.
    address: 127.0.0.1
    port: 8765
    tls: false            # TLS ends at Cloudflare; the hop to here is loopback

    # --- What a client may do ---
    # parameters         read AND set parameters on any node
    # parametersSubscribe  be told when a parameter changes
    # services           call any service
    # connectionGraph    see which node publishes/subscribes what
    # assets             fetch package:// meshes and URDFs (asset_uri_allowlist)
    #
    # clientPublish is DELIBERATELY ABSENT. NEVER ADD IT BACK.
    #
    # Measured 2026-09-27 on foxglove_bridge 3.5.0: with clientPublish on,
    # client_topic_whitelist below is declared, reads back as
    # ['^/initialpose$'] -- and is NOT ENFORCED. A client advertised
    # /drive, published a message, and it arrived on /drive. A message
    # published straight onto /drive goes to ackermann_mux without passing
    # through any driving node, so it skips the LB deadman every driving
    # node enforces in its own code (docs/architecture.md): a
    # remote-control car with no dead-man switch.
    #
    # With clientPublish absent, the same test is refused ("Server does not
    # support clientPublish capability") and nothing reaches /drive. The
    # price is that Lichtblick cannot publish /initialpose either; set the
    # pose estimate from RViz on the car's network instead.
    # See docs/foxglove-bridge.md, "Why clients cannot publish anything".
    capabilities: [parameters, parametersSubscribe, services, connectionGraph, assets]

    # Kept as a second line of defence for the day a bridge version does
    # enforce it. On 3.5.0 it does nothing -- the capability above is what
    # actually stops publishing.
    client_topic_whitelist: ['^/initialpose$']

    # --- Topics a client may subscribe to ---
    # Everything EXCEPT raw camera and raw depth images. One 424x240 color
    # frame is ~300 kB and a depth frame ~200 kB, at 15 Hz each: ~7 MB/s
    # through the tunnel for one viewer. The compressed transports
    # (.../compressed, .../compressedDepth) stay allowed; theora and zstd
    # are excluded too, as they are other ways to ship the same raw stream.
    #
    # One regex with a negative lookahead (the bridge uses ECMAScript
    # regexes): a topic is refused when its LAST path segment is one of the
    # names below. Checked against the RealSense's real topic names in
    # src/racerbot_launch/test/test_foxglove_bridge_config.py.
    #
    # Note: compressed topics only exist if image_transport_plugins is
    # installed. Without it the camera simply does not appear in Lichtblick;
    # the MJPEG stream on rb2-cam-origin is unaffected.
    topic_whitelist: ['^(?!.*/(image|image_raw|image_rect|image_rect_raw|image_mono|image_color|image_rect_color|theora|zstd)$).*$']

    # Every service and every parameter, as asked for. This is broader than
    # the web dashboard's bounded tuning panel: see docs/foxglove-bridge.md,
    # "What it exposes", before widening who can reach the tunnel hostname.
    service_whitelist: ['.*']
    param_whitelist: ['.*']

    # --- Everything else: the package defaults, written out so a reader
    # does not have to go and look them up ---
    include_hidden: false
    min_qos_depth: 1
    max_qos_depth: 10
    num_threads: 0
    send_buffer_limit: 10000000
    use_sim_time: false
    publish_client_count: false
    sysinfo: true
    sysinfo_topic: /foxglove_bridge/sysinfo
    sysinfo_refresh_interval: 500
    message_backlog_size: 1024
    ignore_unresponsive_param_nodes: true
    asset_uri_allowlist: ['^package://(?:[-\w%]+/)*[-\w%.]+\.(?:dae|fbx|glb|gltf|jpeg|jpg|mtl|obj|png|stl|tif|tiff|urdf|webp|xacro)$']
    # Foxglove's own cloud remote-access feature. Off: remote access here
    # is the Cloudflare Tunnel, not Foxglove's servers.
    remote_access: false
