web_dashboard_node:
  ros__parameters:
    # --- Topics ---
    map_topic: /map
    scan_topic: /scan
    # Every pose source this car can run, subscribed at once so the same
    # dashboard process works across all of them without a relaunch:
    #   /pf/viz/inferred_pose  particle_filter (race/localization stacks)
    #   /slam_pose             auto_map_race_node, while slam_toolbox maps
    pose_topics:
      - /pf/viz/inferred_pose
      - /slam_pose
    drive_topic: /ackermann_cmd  # selected command after ackermann_mux
    odom_topic: /odom            # measured longitudinal speed
    joy_topic: /joy              # read-only LB state for the stopwatch
    # What the running driving node says it is *trying* to do -- the intent
    # arrow and the decision panel. Still just another subscription; this
    # dashboard publishes to no topic. See docs/drive-intent.md.
    intent_topic: /drive_intent
    # Malformed intent messages are reported at most this often. A publisher
    # getting the schema wrong is usually getting it wrong at 20Hz, and the
    # flood would bury the driving logs beside it.
    intent_warn_period_sec: 5.0
    deadman_button: 4            # Logitech F710 LB in XInput mode
    joy_timeout_sec: 0.5         # same freshness limit as the driving nodes
    # The browser runs the clock between updates (it interpolates from the
    # last snapshot), so this only has to be often enough to correct drift
    # and to carry LB press/release promptly.
    stopwatch_update_rate_hz: 4.0

    # --- Web server ---
    # Every interface, IPv4 *and* IPv6 -- the node treats this wildcard as
    # "bind everything" rather than passing it straight to the web server,
    # which would bind IPv4 only and leave the dashboard unreachable at the
    # car's Tailscale IPv6 address. See web_dashboard/netbind.py and
    # docs/web-dashboard.md's security note.
    host: 0.0.0.0
    # Set a real address instead (e.g. 127.0.0.1) to restrict it to one.
    port: 8080

    # --- Bandwidth ---
    # See docs/web-dashboard.md "What this costs the car" for the measured
    # before/after. The short version: this dashboard used to push ~900 kB/s
    # over WiFi while the car was being driven around, almost all of it the
    # occupancy grid being re-sent in full every few seconds, and that is
    # what made everything else on the link feel laggy.
    scan_broadcast_rate_hz: 10.0   # /scan itself runs ~40Hz; no browser needs to redraw that often
    stats_interval_sec: 1.0        # how often CPU/mem/temp/uptime are sampled and broadcast

    # Pose, command, speed, intent, stopwatch and system stats are collected
    # and sent as ONE frame at this rate rather than one frame each. Their
    # inputs run at 32-44Hz apiece (~155 frames/s in total) and a WebSocket
    # frame costs roughly the same however small it is, so this is about an
    # 8x saving on framing alone. 20Hz is already faster than a screen
    # refreshes; raising it buys nothing a person can see.
    telemetry_rate_hz: 20.0

    # The map is sent as changes rather than in full -- a keyframe when a
    # browser connects or the grid is resized, then just the rectangle of
    # cells that actually moved (measured: ~200 bytes against 4MB). Set
    # map_patching false to go back to whole grids if a patch is ever
    # suspected of painting the map wrong; map_compression false sends them
    # uncompressed as well.
    map_compression: true
    map_patching: true
    map_keyframe_sec: 30.0   # resend the whole grid this often, so a client cannot stay wrong

    # 'u16mm' sends each beam as a uint16 of millimetres: half the bytes of
    # 'f32', and far below both a screen pixel and the LIDAR's own accuracy.
    # scan_decimation sends only every Nth beam -- 1 (every beam) is the
    # default because at 2 bytes each the scan is no longer the problem.
    scan_encoding: u16mm
    scan_decimation: 1

    # --- LIDAR mounting offset from base_link, used to place scan points
    # correctly relative to the car's pose (see docs/hardware-reference.md).
    # Measured 2026-08-24: 0.26 m = the 0.36 m wheelbase less the 0.10 m the
    # LiDAR sits behind the front axle. Must match the base_link->laser
    # static transform in bringup_launch.py, or the dashboard draws the scan
    # somewhere the car is not looking. ---
    laser_offset_x: 0.26
    laser_offset_y: 0.0

    # --- Live parameter tuning ---
    # The one part of this dashboard that reaches the car rather than just
    # watching it: it calls the /<node>/set_parameters service of the nodes
    # below so speeds, lookahead, and safety margins can be adjusted from a
    # phone between runs. It still publishes to no topic and cannot make the
    # car move -- that needs an autonomy node and a held LB button, exactly
    # as before. Set false for a strictly read-only dashboard; the panel then
    # disappears and the service clients are never even created.
    enable_tuning: true
    # Latched topic on which auto_map_race_node names the controller it
    # currently has selected. During an auto_map_race run both
    # gap_follow_node and pure_pursuit_node are up and tunable at once,
    # and only one of them is driving; the panel badges which. Nothing
    # publishes this when a single controller runs on its own launch
    # file, and then no badge is shown -- correctly, since there is
    # nothing to confuse it with.
    controller_topic: /auto_map_race/controller
    # The racing line pure_pursuit is following, published latched by
    # whichever controller has a profile loaded. It only exists once a
    # profile is active, so seeing it on the map is the visual answer to
    # 'is pure pursuit driving yet'.
    racing_line_topic: /racing_line
    # The ONLY nodes this dashboard will probe or write to. An explicit list,
    # not bus discovery: this is what keeps it inside this workspace's own
    # driving code and away from teammates' packages and vendored drivers. A
    # node must also advertise a live_tunable_spec parameter to appear at all.
    tuning_nodes:
      - pure_pursuit_node
      - gap_follow_node
    # Parallel to tuning_nodes: where "save" writes each node's tune back to.
    # Resolved through the install symlinks to the git-tracked file in src/,
    # so a saved tune shows up in `git diff` for review. Blank = tunable live
    # but never savable.
    tuning_config_files:
      - pure_pursuit/config/pure_pursuit.yaml
      - gap_follow/config/gap_follow.yaml
    # Set false to allow live tuning but forbid writing it to disk -- a
    # reasonable race-day setting, where you want to adjust between runs but
    # not to discover afterwards that the committed config drifted.
    tuning_allow_save: true
    tuning_refresh_sec: 2.0          # how often node presence/values are re-read
    tuning_request_rate_hz: 20.0     # how quickly a moved slider reaches the car
    tuning_service_timeout_sec: 3.0  # give up on an unanswered parameter service call

    # --- Stopping driving processes ---
    # The "stop" panel: find the driving nodes actually running on this
    # machine and end them, including ones a Ctrl+C failed to clear that are
    # still publishing to /drive. It sends SIGINT first -- exactly what
    # Ctrl+C sends -- then SIGTERM, then SIGKILL.
    #
    # THIS IS NOT AN EMERGENCY STOP. Stopping a driving node does not brake
    # the car; it removes whatever was commanding it, and the VESC then holds
    # its last command until the VESC firmware's own motor timeout releases
    # it. The emergency stop is releasing LB, which actively publishes zeroes
    # at a higher priority. See docs/web-dashboard.md.
    #
    # Set false to remove the panel and the capability entirely.
    enable_process_control: true
    # The only process names a browser can ever stop.
    #
    # Anything in the actuation path is refused no matter what you put here
    # -- ackermann_mux, joy_teleop, joy_node, the VESC chain, bringup_launch
    # and teleop_launch. Adding one of those below does not enable it; it
    # logs a warning at startup and is ignored. The reason is asymmetry:
    # killing a driving algorithm leaves a car with no algorithm, which is
    # safe, while killing the mux leaves a moving car that releasing LB can
    # no longer stop. See web_dashboard/proccontrol.py's PROTECTED.
    #
    # urg_node, particle_filter and slam_toolbox are deliberately absent:
    # none can move the car, but killing one mid-run degrades a *running*
    # controller rather than stopping it, and pure_pursuit with a frozen pose
    # is worse than pure_pursuit with no pose. Add them if you want them.
    killable_nodes:
      # this workspace
      - pure_pursuit_node
      - gap_follow_node
      - auto_map_race_node
      # racerbot_a / racerbot_b
      - gap_finder_node
      - ftg_node
      - follow_the_gap_node
      - reactive_node
      - wall_follow_node
      - safety_node
      # racerbot_sim -- a stale one forges LB and fakes a /scan
      - gym_bridge_node
      - sim_joy_node
      # the launches that own the above
      - pure_pursuit_launch.py
      - gap_follow_launch.py
      - auto_map_race_launch.py
      - sim_launch.py
    process_stop_grace_sec: 2.0      # per signal, before escalating to the next
    process_scan_interval_sec: 2.0   # how often the running-process list refreshes

    # --- Saved maps, and clearing them ---
    # The only part of this dashboard that touches the DISK. It lists the
    # run directories the car's own tooling writes, and can delete one --
    # permanently, with no undo and no trash. It never writes a file.
    #
    # The unit is a whole run directory, never a file inside one, and that
    # is deliberate: map.yaml names its image relatively, the racing line in
    # the same directory was optimized against that exact grid, and the pose
    # graph is the only way back to a map whose save raced. Deleting map.pgm
    # while leaving map.yaml is the worst of all -- nav2's map_server then
    # fails to configure and particle_filter blocks in its constructor
    # waiting on /map_server/map. So a partial delete is made impossible
    # rather than merely discouraged. See web_dashboard/mapstore.py.
    #
    # Set false to remove the panel and the capability entirely.
    enable_map_delete: true
    # The ONLY directories a browser can ever see, or delete inside.
    #   ~/.ros/racerbot_auto      auto_map_race_node's output_directory
    #   ~/.ros/racerbot_sim/auto  the simulator's equivalent
    #
    # Refused no matter what you put here: anything inside a git working
    # tree (src/particle_filter/maps holds tracked upstream demo maps, and a
    # browser deleting tracked files would show up as a mystery in
    # `git status`), ~/.ros/racerbot_sim/tracks (generated simulator
    # *inputs*, not run output -- deleting one breaks the sim), $HOME
    # itself, and any top-level system directory. Each refusal is logged at
    # startup and the root is ignored; see mapstore._protected_root_reason.
    #
    # Maps saved the manual way (`ros2 run nav2_map_server map_saver_cli -f
    # <name>`) land in whatever directory you ran that command from, so they
    # are not listed here -- there is no canonical place to list them from.
    map_roots:
      - ~/.ros/racerbot_auto
      - ~/.ros/racerbot_sim/auto
    # Directory sizes are cheap but not free, and a run directory only
    # changes when a run ends.
    map_scan_interval_sec: 10.0

    # --- Resetting live SLAM ---
    # Calls slam_toolbox's own /slam_toolbox/reset: throws away the pose
    # graph and starts mapping again from the current scan. Useful when a
    # mapping lap went wrong and you would rather not restart the launch.
    #
    # REFUSED WHILE ANY DRIVING NODE IS RUNNING, for exactly the reason
    # slam_toolbox is absent from killable_nodes above: a controller with a
    # frozen or jumping pose is more dangerous than one with no pose. A
    # reset under a live controller is that same hazard with a different
    # trigger. See proccontrol.DRIVING_CONTROLLERS.
    #
    # It also stalls briefly. slam_toolbox handles this on its own executor,
    # so the map->odom transform -- and every pose derived from it -- stops
    # updating until the call returns. That is the same freeze this
    # workspace already documents for save_map/serialize_map in
    # auto_map_race.yaml. Do it with the car stopped.
    enable_slam_reset: true
    slam_reset_service: /slam_toolbox/reset
    slam_reset_timeout_sec: 10.0
