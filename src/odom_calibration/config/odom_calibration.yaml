odom_calibration_node:
  ros__parameters:
    odom_topic: /odom
    vesc_state_topic: /sensors/core
    # After vesc_driver's servo_min/servo_max clamp: what the servo receives.
    servo_topic: /sensors/servo_position_command
    # Before the clamp: compared with servo_topic to spot clipping.
    servo_command_topic: /commands/servo/position
    drive_topic: /ackermann_cmd
    joy_topic: /joy
    deadman_button: 4
    # joy_teleop.yaml's human_control steering axis (this F710's right stick).
    steering_axis: 3
    host: 0.0.0.0
    port: 8090
    telemetry_rate_hz: 5.0
    topic_stale_sec: 0.75
    max_capture_sec: 300.0
    max_samples_per_topic: 30000
    report_directory: "~/.ros/odom_calibration"

    # --- Writing vesc.yaml and joy_teleop.yaml ------------------------------
    # The report and the drive-straight step can write accepted values after
    # a confirmation: steering gain/offset and servo_min/servo_max into
    # vesc.yaml, the full-stick steering angle into joy_teleop.yaml. A
    # timestamped backup of each file goes to <report_directory>/backups/
    # first, and Undo puts back every file of the last write. Set false to
    # make the wizard suggest-only. Empty path = the file bringup/teleop
    # loads, followed through the --symlink-install link back to src/.
    allow_apply: true
    vesc_yaml_path: ""
    joy_teleop_yaml_path: ""

    # --- This car ------------------------------------------------------------
    # Change these for another car; nothing else in the wizard is car-specific.
    vehicle_model: "Traxxas Ford Fiesta ST Rally VXL 74276-4 (car 2)"
    physical_width_m: 0.30
    physical_length_m: 0.535
    # Largest steering angle any driving node may request (gap_follow.yaml and
    # pure_pursuit.yaml max_steering_angle). The clamp check warns when
    # servo_min/servo_max cut it short on either side.
    planner_max_steering_rad: 0.349
    # Rear tire centre to centre (m). Turns an inner-tire-only circle into
    # the rear-axle circle: radius = (inner diameter + track) / 2. 0.27 m came
    # from the inner and outer circles of 2026-10-10 (outer - inner = 2 x
    # track); re-measure it with the "both rear tires" option on another car.
    rear_track_m: 0.27

    # Fallbacks, used only until the live values are read from the running
    # nodes (vesc_to_odom_node, ackermann_to_vesc_node, vesc_driver_node).
    speed_to_erpm_gain: -4447.983786
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -0.78
    steering_angle_to_servo_offset: 0.5904
    # Measured 2026-08-24, front axle to rear axle. Matches vesc.yaml.
    wheelbase: 0.36
    servo_min: 0.15
    servo_max: 0.95
